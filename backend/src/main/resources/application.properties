# FOODCHAIN BACKEND CONFIGURATION
server.port=${SERVER_PORT:8080}

# Configuration Import (untracked local overrides)
spring.config.import=optional:file:application-local.properties

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodchain_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration (non-destructive)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS Configuration
foodchain.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

# Logging
logging.level.com.foodchain=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
